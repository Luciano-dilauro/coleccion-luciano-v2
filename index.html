<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Colección</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">
        <header id="appHeader">
            <button id="backBtn" class="hidden">←</button>
            <h1 id="headerTitle">Principal</h1>
        </header>

        <main id="scrollContainer">

            <!-- Vista de detalle SIEMPRE activa -->
            <section id="view-detail" class="view active">
                <div id="detailSticky">
                    <div class="detail-header">
                        <div id="detailCover" class="detail-cover">📘</div>
                        <div class="detail-stats-wrapper">
                            <div class="detail-stats">
                                <div><span>📊 Total</span> <strong id="dTotal">0</strong></div>
                                <div><span>✅ Tengo</span> <strong id="dHave">0</strong></div>
                                <div><span>❌ Faltan</span> <strong id="dMissing">0</strong></div>
                                <div><span>📈 Progreso</span> <strong id="dPct">0%</strong></div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="tabs">
                        <button class="tab active btn-white" data-filter="all">Todas</button>
                        <button class="tab btn-white" data-filter="miss">Faltan</button>
                        <button class="tab btn-white" data-filter="rep">Repetidas</button>
                    </div>

                    <div class="detail-actions">
                        <button id="exportListBtn" class="action-btn">📤 Exportar</button>
                        <button id="completeBtn" class="action-btn">✅ Completar</button>
                        <button id="resetBtn" class="action-btn">🔄 Reiniciar</button>
                    </div>
                </div>

                <div id="detailGrid" class="grid-4"></div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
