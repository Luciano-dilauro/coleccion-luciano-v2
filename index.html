<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Colección</title>
    <style>
        /* Estilos básicos para que funcione */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        #app {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        #backBtn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
        }
        
        #backBtn.hidden {
            display: none;
        }
        
        #headerTitle {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
        }
        
        #scrollContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .view {
            display: none;
        }
        
        .view.active {
            display: block;
        }
        
        .main-grid {
            text-align: center;
            padding: 40px 20px;
        }
        
        .main-title {
            display: block;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .main-sub {
            display: block;
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .main-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        
        .main-btn:hover {
            background: #0055b3;
        }
        
        .main-icon {
            font-size: 28px;
        }
        
        /* Estilos para la vista de gestión */
        #view-manage {
            padding: 20px 0;
        }
        
        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .coleccion-item {
            background: #f8f8f8;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .coleccion-nombre {
            font-weight: 500;
        }
        
        .coleccion-count {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="appHeader">
            <button id="backBtn" class="hidden" onclick="goBack()">←</button>
            <h1 id="headerTitle">Principal</h1>
        </header>

        <main id="scrollContainer">
            <!-- Vista Principal -->
            <section id="view-main" class="view active">
                <div class="main-grid">
                    <span class="main-title">Mis colecciones</span>
                    <span class="main-sub">Ver todos tus álbumes</span>
                    <button class="main-btn" onclick="cambiarVista('manage')">
                        <span class="main-icon">📂</span>
                        Gestionar
                    </button>
                </div>
            </section>

            <!-- Vista de Gestión -->
            <section id="view-manage" class="view">
                <div class="manage-header">
                    <h2>Gestionar colecciones</h2>
                    <button onclick="cambiarVista('main')" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
                </div>
                <div id="listaColecciones">
                    <div class="coleccion-item">
                        <span class="coleccion-nombre">📘 Libros</span>
                        <span class="coleccion-count">12 items</span>
                    </div>
                    <div class="coleccion-item">
                        <span class="coleccion-nombre">🎵 Música</span>
                        <span class="coleccion-count">8 items</span>
                    </div>
                    <div class="coleccion-item">
                        <span class="coleccion-nombre">🎬 Películas</span>
                        <span class="coleccion-count">5 items</span>
                    </div>
                </div>
                <button onclick="agregarColeccion()" style="width:100%;padding:14px;background:#34c759;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:12px;">
                    + Agregar colección
                </button>
            </section>
        </main>
    </div>

    <script>
        // Función para cambiar entre vistas
        function cambiarVista(vista) {
            // Ocultar todas las vistas
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('active');
            });
            
            // Mostrar la vista seleccionada
            const vistaElement = document.getElementById('view-' + vista);
            if (vistaElement) {
                vistaElement.classList.add('active');
            }
            
            // Actualizar título del header
            const titulo = document.getElementById('headerTitle');
            if (vista === 'main') {
                titulo.textContent = 'Principal';
                document.getElementById('backBtn').classList.add('hidden');
            } else if (vista === 'manage') {
                titulo.textContent = 'Gestión';
                document.getElementById('backBtn').classList.remove('hidden');
            }
        }
        
        // Función para volver atrás
        function goBack() {
            cambiarVista('main');
        }
        
        // Función para agregar colección
        function agregarColeccion() {
            const nombre = prompt('Nombre de la nueva colección:');
            if (nombre && nombre.trim()) {
                const lista = document.getElementById('listaColecciones');
                const nuevoItem = document.createElement('div');
                nuevoItem.className = 'coleccion-item';
                nuevoItem.innerHTML = `
                    <span class="coleccion-nombre">📁 ${nombre.trim()}</span>
                    <span class="coleccion-count">0 items</span>
                `;
                lista.appendChild(nuevoItem);
            }
        }
        
        // Inicializar la vista principal
        cambiarVista('main');
    </script>
</body>
</html>
