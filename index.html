<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Colección</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">
        <!-- BARRA SUPERIOR (HEADER FIJO CON TODO) -->
        <header id="appHeader">
            <div class="header-top">
                <button id="backBtn" class="hidden">←</button>
                <h1 id="headerTitle">Principal</h1>
            </div>

            <!-- BLOQUE DE PORTADA + INFO + BARRA (DENTRO DEL HEADER) -->
            <div class="detail-header">
                <div id="detailCover" class="detail-cover">📘</div>
                <div class="detail-stats-wrapper">
                    <div class="detail-stats">
                        <div><span>📊 Total</span> <strong id="dTotal">0</strong></div>
                        <div><span>✅ Tengo</span> <strong id="dHave">0</strong></div>
                        <div><span>❌ Faltan</span> <strong id="dMissing">0</strong></div>
                        <div><span>📈 Progreso</span> <strong id="dPct">0%</strong></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                    </div>
                </div>
            </div>

            <!-- FILTROS (DENTRO DEL HEADER) -->
            <div class="tabs">
                <button class="tab active btn-white" data-filter="all">Todas</button>
                <button class="tab btn-white" data-filter="miss">Faltan</button>
                <button class="tab btn-white" data-filter="rep">Repetidas</button>
            </div>
        </header>

        <!-- CONTENEDOR DE SCROLL (SOLO LA GRILLA) -->
        <main id="scrollContainer">
            <div id="detailGrid" class="grid-4"></div>
        </main>

        <!-- MODAL CONFIRMAR -->
        <div id="confirmModal" class="modal hidden">
            <div class="modal-box">
                <p id="confirmMsg">¿Estás seguro?</p>
                <div class="row-2">
                    <button id="confirmNo" class="btn-secondary">No</button>
                    <button id="confirmYes" class="btn-primary">Sí</button>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
